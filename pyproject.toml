[project]
name = "clipped"
version = "0.1.0"
description = "A macOS-first audio/video clipping tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "yt-dlp>=2023.0.0",
    "mutagen>=1.46.0",
    "tomlkit>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipped"]
