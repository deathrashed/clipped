[general]
# The directories where your clipped audio and video files will be saved.
audio_dir = "~/Music/clipped/_audio"
video_dir = "~/Music/clipped/_video"

# Automatically copy the generated file to the clipboard (Finder-ready).
copy_to_clipboard = true

# Show an interactive TUI for previewing and adjusting the clip.
interactive_preview = true

# Manage this file with: clipped config show | edit | init | reset

# Automatically apply a fade-in and fade-out to the clipped audio.
auto_fade = true

# The duration of the audio fade (in seconds).
fade_duration = 0.5

# Speed of the spinning record (revolutions per second).
spinner_speed = 0.5

# ── Waveform Bar template options ──────────────────────────────────────────────
# Mode for waveform rendering: line | cline | p2p | point
waveform_mode  = "line"
# Hex colour for the waveform bar (default: vivid cyan)
waveform_color = "0x00E5FF"

# ── Remotion template defaults ────────────────────────────────────────────────
remotion_style      = "classic" # classic | brutal | neon | zine | cinematic
remotion_motion     = "medium"  # low | medium | high
remotion_waveform   = "radial"  # none | bars | radial | ring
remotion_palette    = "auto"    # auto | cyan | red | gold | mono
remotion_scene_pack = "story"
remotion_effects    = "texture"
remotion_captions   = "off"
remotion_fps        = 30

# Default template and platform.
default_template = "gallery_square"
default_platform = "default"

# ── Named presets ──────────────────────────────────────────────────────────────
# Run with: clipped --preset instagram
# Each key overrides the matching [general] key.

[preset.instagram]
default_template = "pulse_reel"
default_platform = "instagram"

[preset.tiktok]
default_template = "pulse_reel"
default_platform = "tiktok"

[preset.youtube_shorts]
default_template = "pulse_reel"
default_platform = "youtube_shorts"

[preset.vertical_full]
default_template = "pulse_reel"
default_platform = "vertical_full"

[preset.archive]
default_template = "gallery_square"
default_platform = "default"

[preset.cinematic]
default_template = "cinematic"
default_platform = "youtube"

[preset.discord]
default_platform = "discord"

[preset.waveformbar]
default_template = "record_square"
default_platform = "default"

# ── Waveform colour variants ───────────────────────────────────────────────────
# You can create custom presets for different waveform colour palettes, e.g.:
#
# [preset.waveform_red]
# default_template = "waveformbar"
# waveform_color   = "0xFF2D55"
# waveform_mode    = "cline"
#
# [preset.waveform_gold]
# default_template = "waveformbar"
# waveform_color   = "0xFFD700"
# waveform_mode    = "p2p"
